[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diazai-t6-ultracode"
version = "1.0.0"
description = "DIAZAI T6 toric mathematics, OASIS adapter, Turing lab, and 100+ tool MCP foundry"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "httpx>=0.27,<1"]

[project.scripts]
t6-ultracode = "t6_ultracode.cli:main"
t6-ultracode-mcp = "t6_ultracode.mcp_stdio:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
