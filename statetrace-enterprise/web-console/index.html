<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StateTrace Enterprise</title><style>:root{--bg:#071018;--p:#0f1d28;--l:#294253;--t:#eef7fa;--m:#9bb0bc;--a:#36c9b5;--r:#e36b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:16px}input,button{width:100%;margin:6px 0;padding:10px;border-radius:9px;border:1px solid var(--l);background:#08141d;color:var(--t)}button{background:var(--a);color:#031210;font-weight:700}.atlas{display:grid;grid-template-columns:repeat(27,1fr);gap:2px;aspect-ratio:1}.cell{background:#142633}.cell.on{background:var(--a)}.cell.bad{background:var(--r)}pre{white-space:pre-wrap;max-height:320px;overflow:auto;color:var(--m)}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>DIAZAI StateTrace Enterprise</h1><p>Offline deterministic replay and first semantic-divergence demonstration.</p><div class="grid"><section class="panel"><label>Events<input id="count" type="number" value="250" min="2" max="5000"></label><label>Mutation position<input id="mut" type="number" value="150" min="0"></label><button id="run">Run scenario</button><p id="status"></p><input id="scrub" type="range" min="0" value="0"><pre id="details"></pre></section><section class="panel"><div id="atlas" class="atlas"></div></section></div></main><script>const $=s=>document.querySelector(s),atlas=$('#atlas');for(let i=0;i<729;i++){const c=document.createElement('div');c.className='cell';atlas.append(c)}const stable=v=>v===null?'null':typeof v==='string'?JSON.stringify(v):typeof v==='number'||typeof v==='boolean'?JSON.stringify(v):Array.isArray(v)?`[${v.map(stable)}]`:`{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${stable(v[k])}`)}}`;async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(stable(v)));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function build(id,n,mutation){const out=[];for(let i=0;i<n;i++){const event={trace_id:id,event_id:`${id}-${i}`,sequence:i,timestamp:new Date(1785508800000+i).toISOString(),source:'OASIS.STARAPIClient',operation:i%2?'web5_quest_complete_objective':'star_api_queue_add_item',effect_class:i%2?'compensating':'exact',payload:{item_id:`item-${i%17}`,quantity:i===mutation?2:1},metadata:{synthetic:true}};const semantic=Object.fromEntries(Object.keys(event).filter(k=>!['trace_id','event_id','timestamp'].includes(k)).sort().map(k=>[k,event[k]]));const h=await hash(semantic),idx=Number(BigInt('0x'+h.slice(0,16))%729n);out.push({event,semantic_hash:h,state_index:idx})}return out}let a=[],b=[],d=0;async function run(){const n=+$('#count').value,m=Math.min(n-1,+$('#mut').value);a=await build('baseline',n,-1);b=await build('candidate',n,m);d=a.findIndex((x,i)=>x.semantic_hash!==b[i].semantic_hash);$('#status').textContent=`First material divergence: ${d}`;$('#scrub').max=n-1;$('#scrub').value=d;render()}function render(){const i=+$('#scrub').value;[...atlas.children].forEach(x=>x.className='cell');atlas.children[a[i]?.state_index||0].classList.add('on');if(d>=0)atlas.children[b[d].state_index].classList.add('bad');$('#details').textContent=JSON.stringify({position:i,baseline:a[i],candidate:i===d?b[i]:undefined},null,2)}$('#run').onclick=run;$('#scrub').oninput=render;run();</script></body></html>
