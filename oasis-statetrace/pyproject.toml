[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diazai-oasis-integration"
version = "1.0.0"
description = "Deterministic replay, canon, conformance, and edge-node integration for OASIS/STARAPIClient"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
diazai-oasis = "diazai_oasis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diazai_oasis = ["static/*", "data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
